[package]
name = "adr073_phase0"
version = "0.0.0"
edition = "2021"
publish = false
description = "ADR-073 Phase 0: throwaway spike + validation harness for the Space Coordination Store. NOT production code and not part of the app build."

[workspace]

[lib]
name = "adr073_phase0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
notify = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL"] }
