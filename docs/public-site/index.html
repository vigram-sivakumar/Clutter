<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Privacy information and support for Clutter for macOS.">
<title>Clutter</title>
<style>
:root { color-scheme: light; --ink:#292a27; --muted:#777a72; --line:#e8e9e3; --paper:#fff; --canvas:#f7f8f5; --accent:#526b58; }
* { box-sizing:border-box; }
body { margin:0; padding:48px 20px; background:var(--canvas); color:var(--ink); font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
main { max-width:720px; margin:0 auto; padding:36px 44px 44px; background:var(--paper); border:1px solid var(--line); border-radius:16px; }
header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-bottom:28px; margin-bottom:38px; border-bottom:1px solid var(--line); }
.brand { color:var(--ink); font-weight:650; letter-spacing:-.3px; text-decoration:none; }
nav { display:flex; gap:22px; }
nav a { color:var(--muted); font-size:14px; text-decoration:none; }
nav a:hover, nav a[aria-current="page"] { color:var(--ink); }
h1 { margin:0 0 8px; font-size:36px; line-height:1.2; letter-spacing:-1.4px; }
h2 { margin:34px 0 10px; font-size:20px; letter-spacing:-.4px; }
h3 { margin:24px 0 8px; font-size:16px; }
p { margin:12px 0; }
.lead { margin:0 0 28px; color:var(--muted); }
.meta { color:var(--muted); font-size:14px; margin:0 0 28px; }
a { color:var(--accent); text-underline-offset:3px; }
footer { margin-top:36px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
.card { padding:22px 24px; margin-top:16px; border:1px solid var(--line); border-radius:12px; }
.card h2 { margin:0 0 6px; font-size:18px; }
.card p { color:var(--muted); margin:0 0 10px; }
@media (max-width:600px) { body { padding:14px 10px; } main { padding:26px 22px 30px; } header { align-items:flex-start; flex-direction:column; gap:14px; margin-bottom:30px; } nav { gap:18px; } h1 { font-size:31px; } }
</style>
</head>
<body>
<main>
<header>
<a class="brand" href="/">Clutter</a>
<nav aria-label="Main navigation">
<a href="/privacy/">Privacy</a>
<a href="/contact/">Contact</a>
</nav>
</header>
<h1>Clutter</h1>
<p class="lead">A little space for your thoughts.</p>
<section class="card">
<h2>Privacy Policy</h2>
<p>Learn how Clutter handles your notes, device data and online features.</p>
<a href="/privacy/">Read the Privacy Policy</a>
</section>
<section class="card">
<h2>Contact Us</h2>
<p>Questions, feedback or need help with Clutter? Get in touch.</p>
<a href="/contact/">Contact Clutter</a>
</section>
<footer>Clutter for macOS</footer>
</main>
</body>
</html>
