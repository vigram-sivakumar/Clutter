<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor V2 – Test</title>
    <!-- Resolve theme before first paint to prevent flash -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('clutter-theme') || 'system';
          var theme =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- First-paint background: the stylesheet (and its --surface-root token)
         isn't loaded yet. Values mirror --surface-root in design-system/theme.css. -->
    <style>
      html[data-theme='dark'] {
        background: #1f1f1f;
      }
      html[data-theme='light'] {
        background: #f9f8f7;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/app/main.tsx"></script>
  </body>
</html>
