[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Saves the filesystem/asset scope the native folder picker grants at runtime and restores it at launch, so a
# space the user picked outside the static `$HOME/**` scope (an external drive, /Volumes, another user's
# shared folder) can be reopened after a restart. Must be registered after the fs plugin (see lib.rs).
tauri-plugin-persisted-scope = "2"
tauri-plugin-http = "2"
notify = "6"
# Opaque per-space cache id for the parsed-note cache (src/parse_cache.rs); already in the graph via tauri.
sha2 = "0.10"

# Automation/testing only, and `optional = true`: excluded from every
# ordinary build's dependency graph (debug or release — `cfg(debug_assertions)`
# is NOT a real Cargo target-cfg predicate, it only covers platform/arch, so
# an earlier attempt to gate this that way silently did nothing and the
# crate ended up in release builds too). The `automation` feature below is
# the actual gate: nothing enables it except packages/automation's own build
# invocation. See packages/automation/AUTOMATION.md.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-opener = "2"

# The startup-recovery alert (src/startup_notice.rs) holds its own
# CFUserNotification handle so it can be cancelled. Already in the graph via
# rfd; features limited to what is used.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDate", "CFDictionary", "CFString", "CFUserNotification"] }

[features]
automation = ["dep:tauri-plugin-wdio-webdriver"]
