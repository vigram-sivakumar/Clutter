<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clutter Foundation</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <strong>Clutter Foundation</strong
      ><span class="notice">Disposable test Space · synthetic text only</span>
    </header>
    <div class="toolbar">
      <button id="save">Save</button><button id="remount">Reopen view A</button
      ><button id="recover">Recover protected A</button
      ><span id="status" role="status">Connecting…</span>
    </div>
    <main>
      <section>
        <h1>View A</h1>
        <div class="history">
          <button id="undo-a">Undo</button><button id="redo-a">Redo</button>
        </div>
        <div id="editor-a"></div>
      </section>
      <section>
        <h1>View B</h1>
        <div class="history">
          <button id="undo-b">Undo</button><button id="redo-b">Redo</button>
        </div>
        <div id="editor-b"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
