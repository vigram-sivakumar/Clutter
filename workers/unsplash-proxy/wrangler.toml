# Clutter's Unsplash proxy. The Unsplash Access Key is NOT in this file: it is a secret binding named
# UNSPLASH_ACCESS_KEY, set with `wrangler secret put UNSPLASH_ACCESS_KEY` (see README.md).
name = "clutter-unsplash-proxy"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true
# Version preview URLs (<version>-clutter-unsplash-proxy.<subdomain>.workers.dev) default to the value of
# `workers_dev`. They would serve this same Worker, with its secret, under extra hostnames; nothing needs them.
preview_urls = false

# Non-secret configuration. Browsers send an Origin header; only these origins get CORS headers: the origins the
# packaged app runs from. tauri://localhost is the macOS app, http(s)://tauri.localhost the Windows/Linux app.
# The dev-server origins are NOT here. For local development add them in `.dev.vars` (see README.md, "Local
# development"), which overrides this value for `wrangler dev` only and is never deployed.
# CORS is not authentication: it only tells browsers which pages may read a reply. The Worker answers any client.
[vars]
ALLOWED_ORIGINS = "tauri://localhost,http://tauri.localhost,https://tauri.localhost"

# Per-client abuse control (Workers Rate Limiting binding): at most 60 requests per 60 seconds per client IP.
# Enforced at the edge before Unsplash is called, so one client cannot spend the shared Unsplash quota.
# `namespace_id` is any positive integer you choose; it only has to be unique among your account's rate limiters.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# No request or response logging by default: search terms are user data and are never logged.
[observability]
enabled = false
